- name: creating ec2 instances and route53
  hosts: local
  connection: local
  vars:
    instances: ['mongodbbb', 'redis', 'mysql', 'rabbitmq', 'catalogue', 'user', 'cart', 'shipping', 'payment', 'frontend']
    action: create
    domain_name: saidevops.shop
  tasks:
  - name: creating ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      image_id: ami-0055977a6e828a4f4
      region: us-east-1
      security_groups: 
      - roboshop-common
      #- "roboshop-{{ item }}"
    loop: "{{instances}}"
    when: action == "create"
    register: ec2_result

  # - name: Print ec2 output
  #   debug:
  #     msg: "{{ ec2_result.results }}"

  # - name: Print the instance name
  #   debug:
  #     msg: "{{ item.item }}.{{domain_name}}"
  #   loop: "{{ ec2_result.results }}" 

  - name: creating route53 records with private_ip_address  # for all instances including frontend using private ip adress
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{item.item}}.{{domain_name}}" #mongodb.saidevops.shop
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_result.results }}"
    when: action == "create"

  - name: creating route53 record for frontend       # only for frontend with public ip address
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{domain_name}}"                         #saidevops.shop
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    when: action == "create" and item.item == "frontend"   # when conditional stmt already evaluated as jinja2 expressions, no need to put item.item in {{}}
    loop: "{{ ec2_result.results }}"

  - name: deleting route53
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{item}}.{{domain_name}}"
      type: A
    loop: "{{instances}}"
    when: action == "delete"

  - name: deleting route53 for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{domain_name}}"
      ttl: 1
      type: A
    when: action == "delete" 

  - name: deleting instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{instances}}"
    when: action == "delete"
