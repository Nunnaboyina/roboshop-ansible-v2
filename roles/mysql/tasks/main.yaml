- name: Enabling mysql
  command: dnf module enable mysql:8.4 -y

- name: Installing mysql
  package:
    name: mysql-server
    state: present
- name: Start the mysql service
  service:
    name: mysqld
    state: started
    enabled: yes

  
- name: set root password
  command: mysql_secure_installation --set-root-pass "{{ansible_mysql_root_password}}"

