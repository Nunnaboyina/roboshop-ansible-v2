- name: copy mongo.repo file
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo
- name: install mongodb
  package:
    name: mongodb-org
    state: present

- name: start and enable mongodb service
  service:
    name: mongod
    state: started
    enabled: yes

- name: allow remote connections
  ansible.builtin.replace:
    path: /etc/mongod.conf  
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: restart the mongod service
  service:
    name: mongod
    state: restarted
    enabled: yes