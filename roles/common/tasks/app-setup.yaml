- name: creating system user
  user:
    name: roboshop
    create_home: false
    system: true
    home: /app    #default path : /home/roboshop
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing app directory
  file:
    path: /app
    state: absent

- name: remove "{{component}}".zip
  file:
    path: /tmp/"{{component}}".zip
    state: absent

- name: create app directory
  file:
    path: /app
    state: directory

- name: download application to location
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/"{{component}}"-v4.zip
    dest: /tmp/"{{component}}".zip

# - name: change app directory
#   command: cd /app

- name: unarchive zip files to app directory
  ansible.builtin.unarchive:
    src: /tmp/"{{component}}".zip
    dest: /app
    remote_src: yes  ## if we don'e set this, ansible tries to copy the files from ansible contorl server to on remote machine
                      # But, here we are trying to unarchive the files which are already existed in the remote server
