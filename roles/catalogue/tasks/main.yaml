- name: testing vars and defaults
  debug:
    msg: "user: {{user}}, version: {{version}}, duration: {{duration}} "

- name: application set up
  include_role:
    name: common
    tasks_from: app-setup

- name: nodejs installation
  include_role: 
    name: common # folder name
    tasks_from: nodejs # yaml file name 

- name: systemd set up
  include_role: 
    name: common
    tasks_from: systemd-setup

- name: Create mongo repo file
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongodb-client 
  command: dnf install mongodb-mongosh -y

- name: check products loaded or not 
  shell: mongosh --host "{{mongodb_host}}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: load master db data
  shell: mongosh --host "{{mongodb_host}}" </app/db/master-data.js
  run_once: true
  when: product_count.stdout | int == 0


- name: restart application
  include_role:
    name: common
    tasks_from: restart


