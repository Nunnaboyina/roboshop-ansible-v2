- name: Disable nodejs
    command: dnf module disable nodejs -y

- name: Enable nodejs version 24
  command: dnf module enable nodejs:24 -y

- name: install nodejs
  package:
    name: nodejs
    state: present

- name: creating system user
  user:
    name: roboshop
    create_home: false
    system: true
    home: /app    #default path : /home/roboshop
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing app directory
  file:
    path: /app
    state: absent

- name: remove catalogue.zip
  file:
    path: /tmp/catalogue.zip
    state: absent

- name: create app directory
  file:
    path: /app
    state: directory

- name: download application to location
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
    dest: /tmp/catalogue.zip

# - name: change app directory
#   command: cd /app

- name: unarchive zip files to app directory
  ansible.builtin.unarchive:
    src: /tmp/catalogue.zip
    dest: /app
    remote_src: yes  ## if we don'e set this, ansible tries to copy the files from ansible contorl server to on remote machine
                      # But, here we are trying to unarchive the files which are already existed in the remote server

- name: Install npm dependencies from package.json
  community.general.npm:
    path: /app

- name: configure catalogue service  ## here, we are normally copyign the text. we are chaging the file 
  template:
    src: catalogue.service.j2
    dest: /etc/systemd/system/catalogue.service


- name: Create mongo repo file
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongodb-client 
  command: dnf install mongodb-mongosh -y

- name: check products loaded or not 
  shell: mongosh --host "{{mongodb_host}}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: load master db data
  shell: mongosh --host "{{mongodb_host}}" </app/db/master-data.js
  run_once: true
  when: product_count.stdout | int == 0

- name: Load the service
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the service
  service:
    name: catalogue
    state: restarted
    enabled: yes



